"Centralizar um conteúdo":"🎯 OBJETIVO: criar uma caixa centralizada com o conteúdo dentro.\n\nPASSO A PASSO (regra .container):\n 1) Largura de 80% do elemento pai.\n 2) Centralize a caixa na horizontal (margem 0 em cima e embaixo, automática nos lados).\n 3) Fundo cinza-claro.\n 4) Espaçamento interno de 20px.\n 5) Texto centralizado dentro da caixa.",
"Botão interativo":"🎯 OBJETIVO: criar um botão estilizado que muda de cor ao passar o mouse, sem JavaScript.\n\nPASSO A PASSO:\n 1) Na regra button: fundo azul e texto branco.\n 2) Remova a borda padrão.\n 3) Arredonde os cantos.\n 4) Dê um espaçamento interno (padding) confortável.\n 5) Na regra button:hover: troque a cor de fundo por outra cor.",
"Divisão visual":"🎯 OBJETIVO: separar duas seções com uma linha.\n\nPASSO A PASSO (regra .conteudo, a segunda seção):\n 1) Crie uma borda apenas na parte de cima.\n 2) Espessura de 1px, estilo contínuo (solid) e cor cinza-clara.",
"Degradê":"🎯 OBJETIVO: criar uma faixa com degradê de roxo para preto usando só CSS.\n\nPASSO A PASSO (regra .faixa):\n 1) Altura de 80px.\n 2) Largura de 100% do elemento pai.\n 3) Fundo em degradê linear: roxo na esquerda, preto na direita.",
"Cabeçalho fixo":"🎯 OBJETIVO: manter o cabeçalho sempre visível ao rolar a página.\n\nSITUAÇÃO: o main tem 1500px de altura, então a página rola.\n\nPASSO A PASSO:\n 1) Na regra .cabecalho: deixe-o fixo na janela (position fixed).\n 2) Encoste-o no topo (0) e na esquerda (0).\n 3) Faça ocupar 100% da largura.\n 4) (Opcional) Dê um fundo colorido para não ficar transparente.\n 5) Na regra main: crie espaço no topo (padding-top) para o conteúdo não ficar escondido embaixo do cabeçalho.",
"Investigar o problema":"🎯 OBJETIVO: corrigir o código para o quadrado roxo ficar no centro exato do retângulo cinza.\n\nPROBLEMA: margin:auto só centraliza na horizontal; na vertical não funciona em um bloco comum.\n\nPASSO A PASSO (na regra .pai):\n 1) Ative o Flexbox.\n 2) Centralize os filhos no eixo horizontal.\n 3) Centralize os filhos no eixo vertical."};
const H={"O que é CSS?":"Pense em uma casa: paredes e tijolos são uma coisa; pintura e decoração são outra.","Formas de aplicar CSS":"Há um jeito dentro da própria tag, um dentro do documento e um em arquivo separado.","Seletores":"Cada símbolo tem um significado: um representa id, outro representa class, e o nome puro representa a tag.","Propriedades e valores":"Releia cada nome em inglês e pense no que ele significa.","Box Model":"Imagine a moldura de um quadro: o que fica entre a foto e a moldura? E entre a moldura e a parede?","Unidades":"Algumas unidades olham para outro elemento antes de decidir o tamanho; outras não.","Classes e IDs":"Pense em CPF: duas pessoas podem ter o mesmo? E várias pessoas podem estar na mesma turma?","Cascata e especificidade":"Quanto mais específico o seletor, mais força ele tem. Qual deles aponta para um único elemento?","Flexbox":"Existe um eixo que segue a direção dos itens e outro que cruza esse caminho.","Pseudo-classes":"O nome da pseudo-classe descreve, em inglês, o que o mouse está fazendo.","Pseudo-elementos":"Pense em 'depois' em inglês e no que precisa existir para algo aparecer.","Posicionamento":"Cada valor responde: em relação a quê o elemento se move?","Bordas e fundos":"Cada linha cuida de uma parte diferente do elemento. Elas se atrapalham?","Responsividade":"Uma regra só vale quando a condição sobre a tela é verdadeira.",
"Prática: seletores":"Um símbolo marca o id, outro marca a class. A tag não leva símbolo.","Prática: propriedades e valores":"Os nomes são em inglês: cor do texto, tamanho da fonte e cor de fundo.","Prática: box model":"Cada espaço tem um nome diferente. A borda pode ser resumida em uma linha só.","Prática: cascata":"Qual símbolo aponta para um único elemento e tem mais força que a class?","Prática: flexbox":"Primeiro ative o modo flex. Depois há duas propriedades de alinhamento, uma para cada eixo; um dos valores começa com 'space-'.","Prática: pseudo-elemento":"Sem conteúdo o elemento virtual não nasce. Para ficar abaixo do texto, ele precisa se comportar como bloco.","Prática: posicionamento":"Para o absolute funcionar, o elemento pai precisa ser uma referência. Depois, use as propriedades de direção.","Prática: responsividade":"Comece com @ e a palavra que dá nome à regra; a condição fica entre parênteses.","Centralizar um conteúdo":"Para centralizar um bloco, as margens dos lados precisam ser iguais e automáticas.","Botão interativo":"O hover é uma regra separada, com dois-pontos junto ao seletor. O botão traz uma borda padrão que precisa sair.","Divisão visual":"Existem propriedades de borda para cada lado: top, right, bottom e left.","Degradê":"É uma função, não uma cor simples. O nome dela descreve o tipo de degradê.","Cabeçalho fixo":"Fixo na janela é diferente de preso ao documento. Como ele sai do fluxo, o conteúdo sobe por baixo dele.","Investigar o problema":"A solução vai no elemento pai, não no filho. São 3 declarações no total."};
L.forEach(x=>{if(!x.o&&DET[x.t])x.q=DET[x.t];x.k=H[x.t]||x.k});
let i=0,score=0,hint=false,wait=false;const out=$('out'),inp=$('in'),ta=$('ta'),pv=$('pv');
const p=(t,c='')=>{const e=document.createElement('div');e.className=c;e.textContent=t;out.appendChild(e);out.scrollTop=1e9};
const doc=(css,q)=>`<style>body{font-family:sans-serif}${css}</style>${q.h}`;
function hud(){$('lv').textContent=`Nível ${Math.min(i+1,L.length)}/${L.length}`;$('sc').textContent=`Pontos: ${score}`;$('bi').style.width=i/L.length*100+'%'}
function start(){if(i>=L.length)return end();const q=L[i];hint=false;wait=false;pv.style.width=q.w||'';out.innerHTML='';hud();
p(`[NÍVEL ${i+1}/${L.length}] ${q.t}`,'h');p(q.q);
if(q.o){ta.hidden=true;$('run').hidden=true;q.o.forEach((o,k)=>p(`  ${'abc'[k]}) ${o}`));p('Digite a, b ou c e Enter.','d');pv.srcdoc=''}
else{ta.hidden=false;$('run').hidden=false;ta.value=q.s;pv.srcdoc=doc(q.s,q);p('\n📄 HTML da página (não pode ser alterado):','d');p(q.h.replace(/></g,'>\n<'),'u')}
inp.focus()}
function win(q){score+=hint?5:10;hud();p('✔ '+q.e,'ok');p('Enter para o próximo nível ▸','d');wait=true}
function run(){const q=L[i];if(q.o||wait)return;pv.srcdoc=doc(ta.value,q);setTimeout(()=>{const r=q.c(pv.contentDocument,ta.value);r.forEach(([l,o])=>{if(o)p('✔ '+l,'ok')});const n=r.filter(x=>!x[1]).length;if(!n)win(q);else{p(`✘ ${n} requisito(s) ainda não atendido(s). Releia o passo a passo.`,'er');p('💡 '+q.k,'d')}},250)}
function end(){hud();out.innerHTML='';ta.hidden=true;$('run').hidden=true;p('🏁 FIM DE JOGO','h');p(`Pontuação final: ${score}/${L.length*10}`,'ok');p(score>=L.length*8.5?'Mestre do CSS!':score>=L.length*5?'Muito bem, continue praticando!':'Revise os conceitos e tente de novo (recarregue a página).','u')}
inp.addEventListener('keydown',e=>{if(e.key!='Enter')return;const v=inp.value.trim().toLowerCase();inp.value='';const q=L[i];if(!q)return;
if(wait&&!v){i++;return start()}
p('$ '+v,'u');
if(v=='pular'){i++;return start()}
if(v=='dica'){hint=true;return p('💡 Dica: '+q.k,'d')}
if(q.o){const k='abc'.indexOf(v);if(v.length!=1||k<0)return p('Use a, b ou c.','d');if(wait)return;
if(k==q.a){pv.srcdoc=q.d?`<style>body{font-family:sans-serif}</style>${q.d}`:'';win(q)}else{p('✘ Resposta incorreta. Tente de novo.','er');p('💡 '+q.k,'d')}}
else if(v=='rodar'||v=='executar')run()});
$('run').onclick=run;ta.addEventListener('keydown',e=>{if(e.ctrlKey&&e.key=='Enter')run()});
let tm;ta.addEventListener('input',()=>{clearTimeout(tm);tm=setTimeout(()=>{const q=L[i];if(q&&!q.o)pv.srcdoc=doc(ta.value,q)},300)});
start();
</script></body></html>
